spring.application.name=TaxTracker

Service.USER_ALREADY_EXIST=User Already Exist
Service.MOBILE_NUMBER_ALREADY_USED=Mobile number already being used
Service.TOO_MANY_FAILED_ATTEMPTS=Too many failed attempts. Try again later.
Service.INVALID_CREDENTIALS=Invalid credentials.
Service.FORM_NOT_FOUND=Form Not Found
Service.USER_NOT_FOUND=User Not Found
wrong_pass=wrong Password

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Tax_payers_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8770}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.user.name=${SECURITY_USERNAME:group7}
spring.security.user.password=${SECURITY_PASSWORD}